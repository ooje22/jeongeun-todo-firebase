<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>할 일</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="week">
        <div class="week-head">
          <div class="month-group">
            <h1 class="month" id="month-label">10월</h1>
            <span class="cal-badge" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <rect x="3.5" y="4.5" width="17" height="16" rx="2.5"></rect>
                <path d="M3.5 9.5h17"></path>
                <path d="M8 3v3"></path>
                <path d="M16 3v3"></path>
              </svg>
            </span>
          </div>
          <div class="week-tools">
            <button type="button" class="week-nav" id="prev-week" aria-label="이전 주">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M14.5 6.5 9 12l5.5 5.5"></path>
              </svg>
            </button>
            <button type="button" class="today-button" id="today-button">오늘</button>
            <button type="button" class="week-nav" id="next-week" aria-label="다음 주">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M9.5 6.5 15 12l-5.5 5.5"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="week-strip" id="week-strip" role="group" aria-label="선택한 날짜가 속한 주"></div>
      </header>

      <section class="todos" aria-labelledby="todo-heading">
        <div class="todo-intro">
          <h2 id="todo-heading">할 일</h2>
          <p class="day-caption" id="day-caption"></p>
          <p class="summary" id="summary">할 일이 없습니다</p>
        </div>

        <form class="composer" id="todo-form">
          <label class="sr-only" for="todo-input">새 할 일</label>
          <input
            id="todo-input"
            type="text"
            placeholder="할 일을 입력하세요"
            maxlength="120"
            autocomplete="off"
            required
          />
          <button type="submit">저장</button>
        </form>
        <p class="status" id="status" aria-live="polite"></p>

        <ul class="list" id="todo-list" aria-live="polite"></ul>
      </section>
    </main>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
  </body>
</html>
